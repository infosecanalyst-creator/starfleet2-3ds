# Star Fleet II: Krellan Commander - DOSBox settings for the New 3DS XL.
# Based on GOG's SF2.conf. The game files go in sdmc:/3ds/starfleet2/game/
# (the contents of the "base" folder from your GOG install).

[sdl]
fullscreen=true
autolock=true
waitonerror=true
priority=higher,normal
usescancodes=true

[dosbox]
machine=svga_s3
memsize=16

[render]
frameskip=0
aspect=false
scaler=none

[cpu]
# The game was tuned for 3300 cycles (GOG's own setting); it runs its
# simulation clock from this, so keep it fixed.
core=normal
cputype=auto
cycles=fixed 3300

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=25

[midi]
mpu401=none
mididevice=none

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=true
pcrate=22050
tandy=auto
tandyrate=22050
disney=false

[joystick]
joysticktype=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=none

[ipx]
ipx=false

[autoexec]
mount c sdmc:/3ds/starfleet2/game
c:
SF2.EXE
exit
